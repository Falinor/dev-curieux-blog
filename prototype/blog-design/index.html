<title>Dev curieux Blog Prototypes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE — throwaway. Answers: "What should the Dev curieux blog look like?"
  Three structurally different directions (A Carnet de bord, B Cartes postales, C Atelier),
  each with Home / Post / Social image, in « plein soleil » (light) and « crépuscule » (dark), FR / EN.
  State lives in the URL hash, e.g. #b-article-en-crepuscule. All posts are sample content.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: one route, three variants swapped by a floating switcher; tokens inherit the landing page's « L'heure dorée » system. */
:root {
  --paper: #fffbf4;
  --card: #fff6e6;
  --ink: #1c140c;
  --muted: #6b5a48;
  --edge: #1c140c;
  --rule: #eadcc6;
  --coral: #ff6a45;
  --coral-text: #b83a1b;
  --sun: #ffc63d;
  --on-sun: #1c140c;
  --link: #1f5182;
  --sky-top: #8fcbff;
  --sky-bot: #eaf6ff;
  --sky-glow: #ffe1a8;
  --sea-1: #1f5182;
  --sea-2: #2e6fa8;
  --sea-3: #5a93c2;
  --sea-4: #7fb0d6;
  --sea-text: #fff6e6;
  --code-bg: #0e2f4d;
  --code-fg: #eaf6ff;
  --tk-kw: #ff9a7a;
  --tk-str: #ffd27a;
  --tk-fn: #9fd4ff;
  --tk-com: #93b2cf;
  --star: transparent;
  --proto-bg: #111111;
  --proto-fg: #f5f5f5;
  --proto-dim: #9a9a9a;
  --proto-on: #ffc63d;
  --font-display: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17112e; --card: #2a2052; --ink: #ffefdc; --muted: #c4b2d6; --edge: #06030d;
    --rule: #3a2e66; --coral: #ff7a55; --coral-text: #ffa384; --sun: #ffc63d; --on-sun: #1c140c;
    --link: #9fd4ff; --sky-top: #241a4b; --sky-bot: #6a3a6e; --sky-glow: #e0654f;
    --sea-1: #0b2440; --sea-2: #123457; --sea-3: #1d4a75; --sea-4: #2b5f8f; --sea-text: #ffefdc;
    --code-bg: #0d0922; --code-fg: #f4e8ff; --tk-kw: #ff9a7a; --tk-str: #ffd27a; --tk-fn: #9fd4ff; --tk-com: #9d8fbf;
    --star: #fff6e6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17112e; --card: #2a2052; --ink: #ffefdc; --muted: #c4b2d6; --edge: #06030d;
  --rule: #3a2e66; --coral: #ff7a55; --coral-text: #ffa384; --sun: #ffc63d; --on-sun: #1c140c;
  --link: #9fd4ff; --sky-top: #241a4b; --sky-bot: #6a3a6e; --sky-glow: #e0654f;
  --sea-1: #0b2440; --sea-2: #123457; --sea-3: #1d4a75; --sea-4: #2b5f8f; --sea-text: #ffefdc;
  --code-bg: #0d0922; --code-fg: #f4e8ff; --tk-kw: #ff9a7a; --tk-str: #ffd27a; --tk-fn: #9fd4ff; --tk-com: #9d8fbf;
  --star: #fff6e6; color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.mono { font-family: var(--font-mono); }
#app { padding-bottom: 120px; min-height: 100vh; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- shared prose + code (each variant restyles around it) ---------- */
.prose { font-size: 1.1875rem; line-height: 1.72; }
.prose > * + * { margin-top: 1.1em; }
.prose h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.2; margin-top: 2em; letter-spacing: -0.01em; }
.prose p, .prose ul, .prose blockquote { margin-bottom: 0; }
.prose ul { padding-left: 1.2em; }
.prose li + li { margin-top: 0.4em; }
.prose code { font-family: var(--font-mono); font-size: 0.86em; background: var(--rule); padding: 0.1em 0.35em; border-radius: 4px; }
.prose pre { margin: 1.6em 0 0; overflow-x: auto; background: var(--code-bg); color: var(--code-fg); padding: 18px 20px; font-size: 0.86rem; line-height: 1.6; }
.prose pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.prose blockquote { margin-left: 0; margin-right: 0; padding: 14px 18px; border-left: 4px solid var(--sun); background: var(--card); }
.prose .file { display: block; font-family: var(--font-mono); font-size: 0.75rem; color: var(--tk-com); margin-bottom: 8px; letter-spacing: 0.04em; }
.k { color: var(--tk-kw); } .s { color: var(--tk-str); } .f { color: var(--tk-fn); } .c { color: var(--tk-com); font-style: italic; }

.notice { font-size: 0.95rem; }
.sample-flag { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ================= VARIANT A — Carnet de bord ================= */
.vA { --measure: 68ch; }
.vA .band { position: relative; height: 92px; background: linear-gradient(var(--sky-top), var(--sky-bot)); border-bottom: 2px solid var(--edge); overflow: hidden; }
.vA .band .sun { position: absolute; right: 14%; bottom: -34px; width: 68px; height: 68px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 10px color-mix(in srgb, var(--sun) 25%, transparent), 0 0 60px var(--sky-glow); }
.vA .band .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--star); }
.vA .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; padding-block: 18px; }
.vA .brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.vA .brand b { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.02em; }
.vA .brand span { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.vA nav { display: flex; gap: 18px; font-family: var(--font-mono); font-size: 0.82rem; }
.vA nav a { color: var(--ink); text-decoration: none; }
.vA nav a:hover { text-decoration: underline; text-decoration-color: var(--coral); }
.vA main { max-width: 1100px; margin: 0 auto; }
.vA .intro { max-width: var(--measure); padding-block: 48px 24px; }
.vA .intro h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 16px; }
.vA .intro h1 em { font-style: normal; background: linear-gradient(transparent 58%, var(--sun) 58%); }
.vA .intro p { font-size: 1.15rem; color: var(--muted); margin: 0; }
.vA .year { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); margin: 32px 0 4px; max-width: var(--measure); }
.vA .year::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.vA .log { list-style: none; padding: 0; margin: 0; max-width: var(--measure); }
.vA .log li { display: grid; grid-template-columns: 8.5ch 1fr; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
.vA .log time { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
.vA .log a.t { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; line-height: 1.2; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.vA .log a.t:hover { text-decoration: underline; text-decoration-color: var(--coral); text-decoration-thickness: 3px; }
.vA .log p { margin: 6px 0 8px; color: var(--muted); }
.vA .tags { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.78rem; }
.vA .tags a { color: var(--coral-text); text-decoration: none; }
.vA .post-wrap { display: grid; grid-template-columns: minmax(0, var(--measure)) 1fr; gap: 64px; padding-block: 48px 24px; }
.vA .post-wrap > * { min-width: 0; }
.vA .crumb { font-family: var(--font-mono); font-size: 0.8rem; }
.vA .post h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 4.6vw, 3.2rem); line-height: 1.06; letter-spacing: -0.03em; margin: 18px 0 14px; }
.vA .meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.vA .lead { font-size: 1.25rem; color: var(--muted); margin: 18px 0 0; }
.vA .notice { margin-top: 22px; padding: 10px 14px; border: 1px dashed var(--muted); color: var(--muted); }
.vA .prose { margin-top: 32px; }
.vA .prose pre { border-radius: 6px; }
.vA aside.toc { position: sticky; top: 24px; align-self: start; font-size: 0.92rem; padding-top: 120px; }
.vA aside.toc h3 { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 500; }
.vA aside.toc ol { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--rule); }
.vA aside.toc li a { display: block; padding: 4px 0 4px 14px; color: var(--ink); text-decoration: none; }
.vA aside.toc li a:hover { color: var(--coral-text); }
.vA .react { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 1rem; }
.vA footer { max-width: 1100px; margin: 64px auto 0; padding-block: 20px; border-top: 2px solid var(--edge); font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
@media (max-width: 960px) {
  .vA .post-wrap { grid-template-columns: minmax(0, 1fr); }
  .vA aside.toc { display: none; }
}
@media (max-width: 520px) {
  .vA .log li { grid-template-columns: 1fr; gap: 4px; }
  .vA .log time { padding-top: 0; }
}

/* ================= VARIANT B — Cartes postales ================= */
.vB { background: linear-gradient(var(--sea-2), var(--sea-1)); color: var(--ink); }
.vB .scene { position: relative; overflow: hidden; background: linear-gradient(var(--sky-top) 0%, var(--sky-bot) 62%, var(--sky-glow) 100%); }
.vB .scene.tall { height: 380px; }
.vB .scene.short { height: 250px; }
.vB .scene .sun { position: absolute; left: 62%; bottom: 52px; width: 120px; height: 120px; border-radius: 50%; background: var(--sun); border: 3px solid var(--edge); box-shadow: 0 0 80px 20px color-mix(in srgb, var(--sun) 45%, transparent); }
.vB .scene.short .sun { width: 86px; height: 86px; bottom: 40px; left: 72%; }
.vB .scene .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--star); }
.vB .scene svg.waves { position: absolute; left: 0; bottom: 0; width: 200%; height: 90px; }
.vB .scene svg.waves path { stroke: var(--edge); stroke-width: 3; }
@media (prefers-reduced-motion: no-preference) {
  .vB .scene svg.waves .w1 { animation: drift 18s linear infinite; }
  .vB .scene svg.waves .w2 { animation: drift 26s linear infinite reverse; }
  .vB .postcard, .vB .sticker { transition: transform 0.25s cubic-bezier(.3,1.6,.5,1), box-shadow 0.2s; }
}
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.vB .navrow { position: absolute; top: 16px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 2; }
.vB .badge { display: inline-flex; align-items: center; gap: 8px; background: var(--card); color: var(--ink); border: 3px solid var(--edge); box-shadow: 4px 4px 0 var(--edge); padding: 6px 12px; transform: rotate(-3deg); font-family: var(--font-display); font-weight: 800; text-decoration: none; letter-spacing: -0.01em; }
.vB .badge small { font-family: var(--font-mono); font-weight: 500; font-size: 0.7rem; color: var(--muted); }
.vB .navrow nav { display: flex; gap: 10px; }
.vB .navrow nav a { background: var(--sun); color: var(--on-sun); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--edge); padding: 4px 10px; font-family: var(--font-mono); font-size: 0.78rem; text-decoration: none; font-weight: 600; }
.vB .hero-copy { position: absolute; left: 0; right: 0; top: 96px; z-index: 2; }
.vB .hero-copy h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 0.98; letter-spacing: -0.035em; margin: 0; max-width: 12ch; color: var(--ink); }
.vB .hl { display: inline-block; background: var(--sun); color: var(--on-sun); border: 3px solid var(--edge); padding: 0 0.15em; transform: rotate(-2deg); box-shadow: 4px 4px 0 var(--edge); }
.vB .hero-copy p { font-size: 1.1rem; max-width: 34ch; margin: 14px 0 0; color: var(--ink); }
.vB .sea { padding-block: 40px 24px; color: var(--sea-text); }
.vB .sea-inner { max-width: 1120px; margin: 0 auto; }
.vB .sea h2.sec { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; margin: 0 0 22px; color: var(--sea-text); }
.vB .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 34px 28px; }
.vB .postcard { position: relative; display: flex; flex-direction: column; gap: 10px; background: var(--card); color: var(--ink); border: 3px solid var(--edge); box-shadow: 6px 6px 0 var(--edge); padding: 22px 22px 18px; text-decoration: none; min-width: 0; }
.vB .postcard:nth-child(3n+1) { transform: rotate(-1.2deg); }
.vB .postcard:nth-child(3n+2) { transform: rotate(0.9deg); }
.vB .postcard:nth-child(3n) { transform: rotate(-0.4deg); }
.vB .postcard:hover { transform: rotate(0) translateY(-4px); box-shadow: 9px 9px 0 var(--edge); }
.vB .postcard.featured { grid-column: 1 / -1; padding: 30px; }
.vB .postcard.featured h3 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); max-width: 22ch; }
.vB .postcard h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.12; margin: 0; letter-spacing: -0.015em; padding-right: 74px; }
.vB .postcard p { margin: 0; color: var(--muted); }
.vB .stamp { position: absolute; top: 14px; right: 14px; width: 62px; height: 70px; background: var(--sun); color: var(--on-sun); outline: 2px dashed var(--edge); outline-offset: -6px; display: grid; place-items: center; text-align: center; font-family: var(--font-mono); font-size: 0.62rem; font-weight: 600; line-height: 1.15; transform: rotate(4deg); padding: 6px; word-break: break-word; }
.vB .postmark { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; border-top: 2px dotted var(--rule); }
.vB .sheet-wrap { max-width: 820px; margin: -70px auto 0; position: relative; z-index: 3; }
.vB .title-card { background: var(--card); border: 3px solid var(--edge); box-shadow: 8px 8px 0 var(--edge); padding: 26px 28px; transform: rotate(-1deg); }
.vB .title-card h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 4.6vw, 3rem); line-height: 1.04; letter-spacing: -0.03em; margin: 8px 0 12px; }
.vB .title-card .lead { margin: 0; font-size: 1.12rem; color: var(--muted); }
.vB .title-card .meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.vB .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.vB .chip { background: var(--sun); color: var(--on-sun); border: 2px solid var(--edge); padding: 1px 8px; font-family: var(--font-mono); font-size: 0.74rem; text-decoration: none; font-weight: 600; }
.vB .sheet { background: var(--card); color: var(--ink); border: 3px solid var(--edge); box-shadow: 8px 8px 0 var(--edge); padding: clamp(20px, 4vw, 44px); margin-top: 34px; }
.vB .sheet .prose pre { border: 3px solid var(--edge); box-shadow: 5px 5px 0 var(--edge); }
.vB .sheet .prose blockquote { background: var(--sun); color: var(--on-sun); border: 3px solid var(--edge); border-left-width: 3px; transform: rotate(-0.6deg); box-shadow: 4px 4px 0 var(--edge); }
.vB .sheet .prose code { background: color-mix(in srgb, var(--sun) 35%, transparent); }
.vB .sheet .prose pre code { background: none; }
.vB .notice { background: var(--sun); color: var(--on-sun); border: 3px solid var(--edge); padding: 10px 14px; transform: rotate(0.8deg); margin: 26px 8px 0; box-shadow: 4px 4px 0 var(--edge); }
.vB .notice a { color: var(--on-sun); font-weight: 600; }
.vB .react { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 36px; padding-top: 18px; border-top: 2px dotted var(--rule); }
.vB .react .btn { background: var(--coral); color: var(--on-sun); border: 3px solid var(--edge); box-shadow: 4px 4px 0 var(--edge); padding: 6px 14px; font-weight: 700; text-decoration: none; }
.vB footer { max-width: 1120px; margin: 56px auto 0; padding-block: 18px; border-top: 3px solid var(--edge); color: var(--sea-text); font-family: var(--font-mono); font-size: 0.78rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
@media (max-width: 600px) {
  .vB .scene.tall { height: 430px; }
  .vB .scene .sun { left: auto; right: 8%; bottom: 46px; width: 84px; height: 84px; }
  .vB .postcard h3 { padding-right: 0; padding-top: 70px; }
  .vB .postcard.featured h3 { padding-top: 70px; }
}

/* ================= VARIANT C — Atelier ================= */
.vC .shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 48px; max-width: 1180px; margin: 0 auto; }
.vC .side { position: sticky; top: 0; align-self: start; padding-block: 28px; display: flex; flex-direction: column; gap: 26px; max-height: 100vh; overflow-y: auto; }
.vC .badge { display: inline-block; background: var(--card); border: 3px solid var(--edge); box-shadow: 4px 4px 0 var(--edge); padding: 8px 12px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.vC .badge span { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 0.7rem; color: var(--muted); }
.vC .side p.bio { margin: 0; color: var(--muted); font-size: 0.95rem; }
.vC .block h4 { margin: 0 0 10px; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.vC .now { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; }
.vC .now li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; }
.vC .now li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--sun); border: 2px solid var(--edge); margin-top: 6px; }
.vC .taglist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.vC .taglist button, .vC .toc a { all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; font-size: 0.92rem; color: var(--ink); border-radius: 4px; }
.vC .taglist button:hover, .vC .toc a:hover { background: var(--rule); }
.vC .taglist button[aria-pressed="true"] { background: var(--sun); color: var(--on-sun); font-weight: 600; }
.vC .taglist button span { font-family: var(--font-mono); font-size: 0.78rem; color: inherit; opacity: 0.75; font-variant-numeric: tabular-nums; }
.vC .taglist button:focus-visible, .vC .toc a:focus-visible { outline: 3px solid var(--coral); }
.vC .toc { counter-reset: s; }
.vC .toc a { justify-content: flex-start; }
.vC .toc a::before { counter-increment: s; content: counter(s, decimal-leading-zero); font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); padding-top: 3px; }
.vC .links { display: flex; flex-wrap: wrap; gap: 10px 14px; font-family: var(--font-mono); font-size: 0.78rem; }
.vC main { padding-block: 28px 0; min-width: 0; }
.vC .head h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 4.4vw, 3rem); line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 8px; }
.vC .head p { margin: 0; color: var(--muted); font-size: 1.08rem; max-width: 56ch; }
.vC .timeline { list-style: none; padding: 0; margin: 36px 0 0; position: relative; }
.vC .timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--rule); }
.vC .entry { position: relative; padding: 0 0 40px 40px; }

// ---------- Prototype shell: state in the hash, e.g. #b-article-en-crepuscule ----------
const VARIANTS = { a: A, b: B, c: C };
const KEYS = Object.keys(VARIANTS);
const PAGES = ['accueil', 'article', 'carte'];
const state = { v: 'a', page: 'accueil', lang: 'fr', theme: null };

function readHash() {
  const parts = (location.hash || '').replace('#', '').toLowerCase().split('-').filter(Boolean);
  for (const t of parts) {
    if (KEYS.includes(t)) state.v = t;
    else if (PAGES.includes(t)) state.page = t;
    else if (t === 'fr' || t === 'en') state.lang = t;
    else if (t === 'soleil') state.theme = 'light';
    else if (t === 'crepuscule') state.theme = 'dark';
  }
}
function writeHash() {
  const t = state.theme === 'light' ? '-soleil' : state.theme === 'dark' ? '-crepuscule' : '';
  try { history.replaceState(null, '', `#${state.v}-${state.page}-${state.lang}${t}`); } catch (e) { /* sandboxed frames may refuse */ }
}
function systemDark() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
function effectiveTheme() { return state.theme || (systemDark() ? 'dark' : 'light'); }

function seg(el, items, current, onPick) {
  el.innerHTML = items.map(([k, label]) => `<button type="button" data-k="${k}" aria-pressed="${k === current}">${label}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => onPick(b.dataset.k));
}
let cleanup = null;
function render(scrollTop) {
  const V = VARIANTS[state.v], u = UI[state.lang];
  if (state.theme) document.documentElement.setAttribute('data-theme', state.theme); else document.documentElement.removeAttribute('data-theme');
  document.documentElement.lang = state.lang;
  const app = document.getElementById('app');
  app.className = 'v' + state.v.toUpperCase();
  if (cleanup) { cleanup(); cleanup = null; }
  if (state.page === 'carte') {
    const p = POSTS[0];
    app.innerHTML = `<div class="gutter"><div class="og-stage"><p class="sample-flag">${u.sample}</p><h1>${u.og} · ${V.name}</h1><p>${u.ogHelp}</p>
      ${V.og(state.lang)}
      <div class="og-feed"><div class="av" aria-hidden="true"></div><div class="who">Dev curieux<span>${state.lang === 'fr' ? 'Développeur fullstack freelance' : 'Freelance fullstack developer'}</span></div>
      <div class="og-wrap">${V.og(state.lang)}</div><div class="og-meta"><strong>${p[state.lang].title}</strong><small>blog.curieux.dev</small></div></div></div></div>`;
  } else {
    app.innerHTML = V[state.page === 'article' ? 'article' : 'home'](state.lang);
  }
  if (state.v === 'c' && state.page === 'article') cleanup = attachProgress();
  document.getElementById('p-label').textContent = `${state.v.toUpperCase()} · ${V.name}`;
  seg(document.getElementById('p-page'), [['accueil', u.home], ['article', u.article], ['carte', u.og]], state.page, k => { state.page = k; update(true); });
  seg(document.getElementById('p-lang'), [['fr', 'FR'], ['en', 'EN']], state.lang, k => { state.lang = k; update(false); });
  seg(document.getElementById('p-theme'), [['light', state.lang === 'fr' ? 'Soleil' : 'Sun'], ['dark', state.lang === 'fr' ? 'Crépuscule' : 'Dusk']], effectiveTheme(), k => { state.theme = k; update(false); });
  if (scrollTop) window.scrollTo(0, 0);
}
function update(scrollTop) { writeHash(); render(scrollTop); }
function cycle(d) { state.v = KEYS[(KEYS.indexOf(state.v) + d + KEYS.length) % KEYS.length]; update(true); }

function attachProgress() {
  const sun = document.getElementById('c-sun'), left = document.getElementById('c-left'), art = document.querySelector('.vC .post');
  const total = POSTS[0].min, label = UI[state.lang].left;
  const onScroll = () => {
    const r = art.getBoundingClientRect(), span = r.height - window.innerHeight;
    const pct = Math.min(1, Math.max(0, span > 0 ? -r.top / span : 1));
    sun.style.left = (pct * 100).toFixed(1) + '%';
    left.textContent = `${Math.max(0, Math.ceil(total * (1 - pct)))} ${label}`;
  };
  window.addEventListener('scroll', onScroll, { passive: true }); window.addEventListener('resize', onScroll); onScroll();
  return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-page],[data-lang],[data-scroll],[data-filter]');
  if (!t) { if (e.target.closest('#app a[href="#"]')) e.preventDefault(); return; }
  e.preventDefault();
  if (t.dataset.scroll) { const el = document.getElementById(t.dataset.scroll); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
  if (t.dataset.filter !== undefined) { C.filter = t.dataset.filter || null; render(false); return; }
  if (t.dataset.page) { state.page = t.dataset.page; update(true); }
  if (t.dataset.lang) { state.lang = t.dataset.lang; update(false); }
});
document.getElementById('p-prev').onclick = () => cycle(-1);
document.getElementById('p-next').onclick = () => cycle(1);
document.addEventListener('keydown', (e) => {
  const a = document.activeElement;
  if (a && (a.matches('input, textarea, select') || a.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!state.theme) render(false); });
window.addEventListener('hashchange', () => { readHash(); render(true); });
readHash();
render(false);
</script>
