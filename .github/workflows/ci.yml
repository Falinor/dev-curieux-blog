name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: Lint commit messages (push)
        if: github.event_name == 'push'
        run: pnpm commitlint --from ${{ github.event.before }} --to ${{ github.sha }}
